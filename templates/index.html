<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-3xl font-bold tracking-tight">📚 Book Finder App</h1>
        <p class="text-indigo-200 mt-1 text-sm">Search titles, authors, and explore literary works instantly</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- Search Bar Form -->
        <form id="search-form" class="flex gap-2 max-w-2xl mx-auto mb-6">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Enter book title, author, or keyword..." 
                required
                class="flex-grow px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-sm"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-sm text-sm flex items-center gap-2"
            >
                Search
            </button>
        </form>

        <!-- Quick Suggestions -->
        <div class="flex flex-wrap justify-center gap-2 mb-10 text-xs">
            <span class="text-slate-500 self-center">Suggestions:</span>
            <button onclick="quickSearch('Classic Literature')" class="bg-white border border-slate-200 px-3 py-1.5 rounded-full hover:bg-indigo-50 transition shadow-xs">Classic Literature</button>
            <button onclick="quickSearch('Python Programming')" class="bg-white border border-slate-200 px-3 py-1.5 rounded-full hover:bg-indigo-50 transition shadow-xs">Python Programming</button>
            <button onclick="quickSearch('Cybersecurity')" class="bg-white border border-slate-200 px-3 py-1.5 rounded-full hover:bg-indigo-50 transition shadow-xs">Cybersecurity</button>
            <button onclick="quickSearch('Philosophy')" class="bg-white border border-slate-200 px-3 py-1.5 rounded-full hover:bg-indigo-50 transition shadow-xs">Philosophy</button>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="hidden flex justify-center items-center py-16">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
        </div>

        <!-- Results Grid -->
        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16 text-slate-400 hidden">
            <p class="text-lg">No books found. Try searching for another title or author!</p>
        </div>
        <div id="error-state" class="text-center py-16 text-red-600 hidden">
            <p class="text-lg">Book search is temporarily unavailable. Please try again shortly.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500">
        Powered by Python Flask, Google Books & Open Library
    </footer>

    <!-- JavaScript Handling -->
    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const loader = document.getElementById('loader');
        const grid = document.getElementById('results-grid');
        const emptyState = document.getElementById('empty-state');
        const errorState = document.getElementById('error-state');

        function quickSearch(term) {
            input.value = term;
            fetchBooks(term);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            fetchBooks(input.value);
        });

        async function fetchBooks(query) {
            loader.classList.remove('hidden');
            grid.innerHTML = '';
            emptyState.classList.add('hidden');
            errorState.classList.add('hidden');

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loader.classList.add('hidden');

                if (!response.ok) {
                    errorState.classList.remove('hidden');
                    return;
                }

                if (data.books.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                data.books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition";
                    card.innerHTML = `
                        <div class="h-48 bg-slate-100 flex items-center justify-center p-4">
                            <img src="${book.thumbnail}" alt="${book.title}" class="h-full object-contain rounded shadow-xs">
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="font-bold text-slate-900 text-sm line-clamp-1 mb-1">${book.title}</h3>
                                <p class="text-xs text-indigo-600 font-medium mb-2">${book.authors}</p>
                                <p class="text-xs text-slate-500 line-clamp-2 mb-4">${book.description}</p>
                            </div>
                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                                <span class="text-slate-400">${book.publishedDate}</span>
                                <a href="${book.previewLink}" target="_blank" class="text-indigo-600 font-medium hover:underline">More Info &rarr;</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                loader.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
